# Logrotate configuration for ConsolePi serial logs
# Install to: /etc/logrotate.d/consolepi-serial
# Created: 2026-03-20

/var/log/ConsolePi/serial/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        # Optional: send signal to compress
        /bin/true
    endscript
}
